Name: bywork
Host: 0.0.0.0
Port: 8888
Timeout: 60000
Log:
  Encoding: plain
  Level: info

DB:
  Driver: sqlite            # mysql in production
  DSN: file:bywork.db       # e.g. user:pass@tcp(host:3306)/bywork?parseTime=false&charset=utf8mb4

# Read-only datasources for 数仓 SQL triggers (production: read-only account / replica)
# ReadOnlySources:
#   dw_vip: ro_user:pass@tcp(replica:3306)/vip

Dev: true                   # dev clock, user switcher login, /api/dev/*
Seed: true                  # seed members, demo cases and the two VIP task types
InternalTicker: true        # run heartbeats in-process; set false when XXL-Job calls /api/jobs/*
JobToken: dev-job-token
PushToken: dev-push-token
StaticDir: ../frontend/dist

LinkDomains: [lark.example.com, crm.example.com]
SignKey: dev-sign-key
WebBaseURL: http://localhost:8888
DisplayTimezone: Asia/Kuala_Lumpur
ScanBudget: 45s
OutboxMaxTry: 6

# AI 配置助手 (docs/ai-assistant.md)
AI:
  Enabled: true
  Provider: scripted        # openclaw: call the internal OpenClaw service; scripted: offline demo without a model
  BaseURL: http://127.0.0.1:18789/v1   # OpenClaw OpenAI-compatible endpoint
  APIKey: ""                # or env BYWORK_AI_API_KEY
  Model: openclaw/bywork    # openclaw/<agentId>
  SampleRows: masked        # masked | none — whether sample_query returns (masked) rows to the model
  AllowedTables: [demo_case, demo_vip]
  MaxSteps: 12
  TurnTimeout: 5m

Lark:
  Enabled: false            # true: deliver via Lark Open API instead of the in-memory dev sender
  BaseURL: https://open.larksuite.com
  AppID: ""
  AppSecret: ""
  VerificationToken: ""
